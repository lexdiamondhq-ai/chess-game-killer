name: ChessGameKiller
options:
  bundleIdPrefix: com.chessgamekiller
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  ChessKit:
    url: https://github.com/chesskit-app/chesskit-swift
    exactVersion: 0.17.0
  ChessKitEngine:
    url: https://github.com/chesskit-app/chesskit-engine
    exactVersion: 0.6.0
targets:
  ChessGameKiller:
    type: application
    platform: iOS
    sources: [ChessGameKiller]
    # Challenge links (chessgamekiller://c/CODE) open the app. Xcode merges this file with the generated keys.
    info:
      path: Support/ChessGameKiller-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLName: com.chessgamekiller.app
            CFBundleURLSchemes: [chessgamekiller]
    dependencies:
      - package: ChessKit
      - package: ChessKitEngine
    postBuildScripts:
      # Stockfish's neural networks are too big for git; this downloads them once and bundles them.
      - name: Bundle Stockfish networks
        script: '"${SRCROOT}/scripts/fetch_nnue.sh" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.chessgamekiller.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chess Game Killer
        INFOPLIST_KEY_NSCameraUsageDescription: Take a photo of a chess board to find the best move.
        # The game and lesson screens are laid out for portrait; iPad keeps every orientation.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"
  ChessGameKillerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ChessGameKillerTests]
    dependencies:
      - target: ChessGameKiller
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ChessGameKiller:
    build:
      targets:
        ChessGameKiller: all
        ChessGameKillerTests: [test]
    # Running from Xcode builds Release, so Stockfish is compiled with optimizations.
    # A Debug build runs the engine unoptimized: much weaker in the same think time.
    run:
      config: Release
    test:
      targets: [ChessGameKillerTests]
