name: ChessGameKiller
options:
  bundleIdPrefix: com.chessgamekiller
  deploymentTarget:
    iOS: "17.0"
  # Marks the project as checked against Xcode 26, so Xcode stops asking to "Update to recommended settings".
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Xcode 26's recommended setting (we have no string catalogs yet, so nothing changes).
    STRING_CATALOG_GENERATE_SYMBOLS: YES
packages:
  ChessKit:
    url: https://github.com/chesskit-app/chesskit-swift
    exactVersion: 0.17.0
  ChessKitEngine:
    url: https://github.com/chesskit-app/chesskit-engine
    exactVersion: 0.6.0
targets:
  ChessGameKiller:
    type: application
    platform: iOS
    # Shared/ holds Today's Move and the widget's faces, compiled into the widget too.
    sources: [ChessGameKiller, Shared]
    # The app group lets the widget read the streak the app writes (Shared/Daily/DailySnapshot.swift).
    entitlements:
      path: Support/ChessGameKiller.entitlements
      properties:
        com.apple.security.application-groups: [group.com.chessgamekiller.app]
    # Challenge links (chessgamekiller://c/CODE) open the app. Xcode merges this file with the generated keys.
    info:
      path: Support/ChessGameKiller-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLName: com.chessgamekiller.app
            CFBundleURLSchemes: [chessgamekiller]
    dependencies:
      - package: ChessKit
      - package: ChessKitEngine
      # The Today's Move widget, embedded in the app.
      - target: ChessGameKillerWidget
    postBuildScripts:
      # Stockfish's neural networks are too big for git; this downloads them once and bundles them.
      - name: Bundle Stockfish networks
        script: '"${SRCROOT}/scripts/fetch_nnue.sh" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.chessgamekiller.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Every look is dark, so the launch screen and system sheets are too (no white flash at launch).
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_CFBundleDisplayName: Chess Game Killer
        INFOPLIST_KEY_NSCameraUsageDescription: Take a photo of a chess board to find the best move.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Leo listens while you hold the button to talk through your move.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Your words become text so Leo can check your plan.
        # The game and lesson screens are laid out for portrait.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # iPhone only for 1.0: nothing has been laid out or tested for iPad yet, and an app that is
        # offered to iPad owners has to work there. Set back to "1,2" once it is designed for it.
        TARGETED_DEVICE_FAMILY: "1"
  ChessGameKillerWidget:
    # Today's Move and the streak on the Home Screen and the Lock Screen.
    type: app-extension
    platform: iOS
    sources: [ChessGameKillerWidget, Shared]
    entitlements:
      path: Support/ChessGameKillerWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.chessgamekiller.app]
    info:
      path: Support/ChessGameKillerWidget-Info.plist
      properties:
        CFBundleDisplayName: Chess Game Killer
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chessgamekiller.app.widget
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  ChessGameKillerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ChessGameKillerTests]
    dependencies:
      - target: ChessGameKiller
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ChessGameKiller:
    build:
      targets:
        ChessGameKiller: all
        ChessGameKillerTests: [test]
    # Running from Xcode builds Release, so Stockfish is compiled with optimizations.
    # A Debug build runs the engine unoptimized: much weaker in the same think time.
    run:
      config: Release
      # Sells the Premium plans in the Simulator before App Store Connect has them.
      storeKitConfiguration: Support/Premium.storekit
    test:
      targets: [ChessGameKillerTests]
