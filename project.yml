name: ChessGameKiller
options:
  bundleIdPrefix: com.chessgamekiller
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  ChessKit:
    url: https://github.com/chesskit-app/chesskit-swift
    exactVersion: 0.17.0
targets:
  ChessGameKiller:
    type: application
    platform: iOS
    sources: [ChessGameKiller]
    dependencies:
      - package: ChessKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chessgamekiller.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chess Game Killer
        TARGETED_DEVICE_FAMILY: "1,2"
  ChessGameKillerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ChessGameKillerTests]
    dependencies:
      - target: ChessGameKiller
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ChessGameKiller:
    build:
      targets:
        ChessGameKiller: all
        ChessGameKillerTests: [test]
    test:
      targets: [ChessGameKillerTests]
