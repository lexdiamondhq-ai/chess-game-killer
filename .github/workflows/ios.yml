name: iOS build and tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  xcode-26-build:
    # Alex builds on the newest Xcode, whose type checker gives up sooner on long
    # SwiftUI expressions. This build flags any expression slower than 150 ms.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Cache Stockfish networks
        uses: actions/cache@v4
        with:
          path: .nnue-cache
          key: nnue-1111cefa1111-37f18f62d772
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen
      - name: Build on the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] && sudo xcode-select -s "$XCODE"
          xcodebuild -version
          status=0
          xcodebuild build \
            -project ChessGameKiller.xcodeproj \
            -scheme ChessGameKiller \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_SWIFT_FLAGS='$(inherited) -Xfrontend -warn-long-expression-type-checking=150 -Xfrontend -warn-long-function-bodies=400' \
            > build26.log 2>&1 || status=$?
          grep -E "error:|\*\* " build26.log | sort -u | head -60 || true
          echo "--- slow to type-check"
          grep -E "type-check|unable to type-check" build26.log | sort -u | head -60 || true
          echo "--- warnings in the app's own code"
          grep -E "ChessGameKiller/.*warning:" build26.log | sort -u | head -80 || true
          exit $status
      - name: Fail on slow expressions
        run: |
          if grep -E "expression took [0-9]+ms to type-check" build26.log | grep -vE "took (1[5-9][0-9]|2[0-9][0-9])ms" | grep -q .; then
            echo "Some expression took 300 ms or more to type-check; split it up."
            exit 1
          fi

  build-and-test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache Stockfish networks
        uses: actions/cache@v4
        with:
          path: .nnue-cache
          key: nnue-1111cefa1111-37f18f62d772
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen
      - name: Pick an iPhone simulator
        id: sim
        run: |
          xcrun simctl list runtimes
          # The newest iOS, on an iPhone 17 Pro when the runner has one.
          DEVICES=$(xcrun simctl list devices available -j \
            | jq -c '[.devices | to_entries[] | select(.key | contains("iOS")) | .key as $rt | .value[] | select(.name | startswith("iPhone")) | {udid, name, rt: $rt}] | sort_by(.rt) | reverse')
          UDID=$(echo "$DEVICES" | jq -r '([.[] | select(.name == "iPhone 17 Pro")] + .)[0].udid')
          echo "$DEVICES" | jq -r '.[] | select(.udid == "'"$UDID"'") | "\(.name) \(.rt)"'
          echo "Using simulator $UDID"
          mkdir -p snapshots
          echo "$DEVICES" | jq -r '.[] | select(.udid == "'"$UDID"'") | "\(.name) \(.rt)"' > snapshots/device.txt
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          status=0
          # Test runner variables reach the tests without the prefix, as SNAPSHOT_DIR.
          TEST_RUNNER_SNAPSHOT_DIR="$PWD/snapshots" xcodebuild test \
            -project ChessGameKiller.xcodeproj \
            -scheme ChessGameKiller \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || status=$?
          # Failures first, so they are never cut off by a long list of passes.
          grep -E "error:|Test Case .* failed|\*\* " build.log | head -80 || true
          grep -E "Executed" build.log | tail -3 || true
          grep -E "\] TIMING " build.log | head -120 || true
          # On a crash: which test was running, and the lines around the error.
          if [ "$status" != 0 ]; then
            grep -E "Restarting after|Test Case '.*' started" build.log | tail -4 || true
            grep -B4 -A24 "Fatal error" build.log | head -60 || true
          fi
          exit $status
      - name: Screenshots on the simulator
        # The tests draw their pictures in-process, which leaves out the system's glass.
        # These are the screen itself, as a phone shows it. A picture that fails never fails the run.
        if: always()
        continue-on-error: true
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          APP=$(find ~/Library/Developer/Xcode/DerivedData -type d -name ChessGameKiller.app -path "*Debug-iphonesimulator*" 2>/dev/null | head -1)
          if [ -z "$APP" ]; then echo "No app was built"; exit 0; fi
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          mkdir -p snapshots
          BUNDLE=com.chessgamekiller.app
          # Each launch opens straight on a game in progress (see Showcase in ChessGameKillerApp.swift).
          shoot() {
            name=$1; shift
            xcrun simctl terminate "$UDID" $BUNDLE 2>/dev/null || true
            xcrun simctl launch "$UDID" $BUNDLE -showcase game "$@" >/dev/null || { echo "Could not launch for $name"; return 0; }
            sleep 10
            xcrun simctl io "$UDID" screenshot "snapshots/device-$name.png" >/dev/null && echo "device-$name.png" || echo "No screenshot for $name"
          }
          shoot gilded-3d -showcaseLook gilded -showcase3D YES
          shoot gilded-flat -showcaseLook gilded -showcase3D NO
          shoot midnight-flat -showcaseLook midnight -showcase3D NO
          shoot faberge -showcaseLook faberge
          shoot neon -showcaseLook neon
          shoot spark -showcaseLook spark -showcaseRival spark -showcaseClock 3+2
          shoot coach -showcaseLook gilded -showcase3D NO -showcaseCoach open
          # The home screen as the app opens on it (in the look the last shot left), then at its sections.
          home() {
            name=$1; shift
            xcrun simctl terminate "$UDID" $BUNDLE 2>/dev/null || true
            xcrun simctl launch "$UDID" $BUNDLE "$@" >/dev/null || { echo "Could not launch for $name"; return 0; }
            sleep 12
            xcrun simctl io "$UDID" screenshot "snapshots/device-$name.png" >/dev/null && echo "device-$name.png" || echo "No screenshot for $name"
          }
          home home
          home home-today -showcaseHomeAt today
          home home-ladder -showcaseHomeAt ladder
          xcrun simctl terminate "$UDID" $BUNDLE 2>/dev/null || true
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Upload screen pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: snapshots
          if-no-files-found: ignore
      - name: Print small screen pictures
        if: always()
        # Small JPEGs in the log, base64, between markers, so the screen can be checked without downloading.
        run: |
          [ -d snapshots ] || exit 0
          cat snapshots/device.txt || true
          # The newest effects print last, so the end of the log shows them; the simulator's own screenshots after all.
          LAST="sculpted-finale sculpted-big-capture check hints capture-fall game-end device"
          ORDERED=$(ls snapshots/*.png | grep -v -E "$(echo $LAST | tr ' ' '|')"; for p in $LAST; do ls snapshots/$p-*.png 2>/dev/null; done)
          for f in $ORDERED; do
            [ -e "$f" ] || continue
            # Look studies and the simulator's screenshots are printed near full size, so they can be judged as on the phone.
            case "$(basename "$f")" in
              study-*|device-*) sips -s format jpeg -s formatOptions 80 -Z 1300 "$f" --out /tmp/small.jpg >/dev/null ;;
              *) sips -s format jpeg -s formatOptions 60 -Z 700 "$f" --out /tmp/small.jpg >/dev/null ;;
            esac
            echo "BEGIN-SCREEN $(basename "$f")"
            base64 -i /tmp/small.jpg | fold -w 3000
            echo "END-SCREEN"
          done
      - name: Print the newest screens again, small
        if: always()
        # The screens being worked on, once more at the very end and small, so a short tail of the log holds them.
        run: |
          [ -d snapshots ] || exit 0
          for f in snapshots/talk-*.png snapshots/coach-open-*.png snapshots/train-session-*.png; do
            [ -e "$f" ] || continue
            sips -s format jpeg -s formatOptions 50 -Z 360 "$f" --out /tmp/tiny.jpg >/dev/null
            echo "BEGIN-SCREEN $(basename "$f")"
            base64 -i /tmp/tiny.jpg | fold -w 3000
            echo "END-SCREEN"
          done
      - name: Test results again
        # The pictures above fill the end of the log, so the test outcome is repeated after them,
        # where a reader of only the last lines still finds a failing test.
        if: always()
        run: |
          [ -f build.log ] || { echo "No build log"; exit 0; }
          grep -iE "Test Case .* failed" build.log | head -40 || true
          grep -E "error:|\*\* " build.log | head -60 || true
          grep -E "Executed" build.log | tail -3 || true
          grep -E "Restarting after|Fatal error" build.log | head -20 || true
          # How the shared engine started, when it was slow to (see StockfishEngine.startEngine).
          grep -E "Stockfish: " build.log | head -10 || true
      - name: Repeat the failures
        if: failure()
        # The pictures above can push the test results out of the log's tail, so they come again, last.
        run: |
          [ -f build.log ] || exit 0
          grep -E "error:|Test Case .* failed|\*\* " build.log | head -80 || true
          grep -E "Executed" build.log | tail -3 || true
          grep -B4 -A24 "Fatal error" build.log | head -60 || true
          # The engine's own account, for a failing engine test.
          grep -E "Stockfish: " build.log | head -10 || true
          grep -E "\] TIMING " build.log | tail -40 || true
