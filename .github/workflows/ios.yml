name: iOS build and tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache Stockfish networks
        uses: actions/cache@v4
        with:
          path: .nnue-cache
          key: nnue-1111cefa1111-37f18f62d772
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen
      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          status=0
          xcodebuild test \
            -project ChessGameKiller.xcodeproj \
            -scheme ChessGameKiller \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || status=$?
          grep -E "error:|Test Case .* (passed|failed)|Executed|\*\* " build.log | head -150 || true
          exit $status
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
