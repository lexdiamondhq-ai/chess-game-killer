name: Leo voice samples (temporary)
on:
  push:
    branches: [claude/project-thread-c22qhl]
    paths: ["scripts/training/leo_voice_design.py", ".github/workflows/leo-voice-samples.yml"]
permissions:
  contents: write
jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 scripts/training/leo_voice_design.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/leo-voices
          git commit -m "Leo voice samples"
          git push origin "HEAD:${GITHUB_REF_NAME}"
