name: Android

# Builds the Android app (android/) for Google Play testing.
#
# - Puts Stockfish 17 (the official Android builds, GPL) inside the app as libstockfish.so.
# - Runs the chess rules' tests and the app's own tests.
# - Builds a debug APK (to install by hand) and a release AAB (to upload to Google Play).
# - Starts an Android emulator and runs the tap tests (TapTests.kt), saving a picture of each step.
#   The emulator is x86_64, so it plays with the small stand-in engine; phones use Stockfish.
#
# Signing: with the repository secrets ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_KEYSTORE_PASSWORD,
# ANDROID_UPLOAD_KEY_ALIAS and ANDROID_UPLOAD_KEY_PASSWORD the AAB is signed with the upload key.
# Without them it is unsigned and can be signed afterwards with jarsigner.
on:
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  # Write, to keep the newest build on a private draft release (android-testing) for signing and upload.
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  STOCKFISH_RELEASE: sf_17

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Stockfish for arm64 and armv7 phones
        run: |
          set -euo pipefail
          base="https://github.com/official-stockfish/Stockfish/releases/download/${STOCKFISH_RELEASE}"
          fetch() { # tar name, binary inside, abi
            mkdir -p "app/src/main/jniLibs/$3" /tmp/sf
            curl -fsSL --retry 4 -o "/tmp/sf/$1" "$base/$1"
            tar -xf "/tmp/sf/$1" -C /tmp/sf
            cp "/tmp/sf/stockfish/$2" "app/src/main/jniLibs/$3/libstockfish.so"
            chmod 755 "app/src/main/jniLibs/$3/libstockfish.so"
            rm -rf /tmp/sf/stockfish
          }
          fetch stockfish-android-armv8.tar stockfish-android-armv8 arm64-v8a
          fetch stockfish-android-armv7-neon.tar stockfish-android-armv7-neon armeabi-v7a
          ls -la app/src/main/jniLibs/*/

      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/upload.jks"
            echo "UPLOAD_KEYSTORE_PATH=${RUNNER_TEMP}/upload.jks" >> "$GITHUB_ENV"
            echo "Signing with the upload key."
          else
            echo "No upload key secret: the AAB will be unsigned."
          fi

      - name: Tests
        run: ./gradlew --no-daemon :chess:test :app:testDebugUnitTest

      - name: Build
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleDebug :app:bundleRelease

      - name: Name the files
        run: |
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk "../out/beauty-of-chess-${GITHUB_RUN_NUMBER}-debug.apk"
          cp app/build/outputs/bundle/release/app-release.aab "../out/beauty-of-chess-${GITHUB_RUN_NUMBER}.aab"
          ls -la ../out

      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: out/
          retention-days: 30

      - name: Keep the newest build on the draft release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-testing >/dev/null 2>&1 || \
            gh release create android-testing --draft --target "${GITHUB_SHA}" \
              --title "Android testing build" --notes "The newest Android build for Google Play testing. A draft: only people who can push here see it."
          gh release upload android-testing out/beauty-of-chess-*.aab out/beauty-of-chess-*-debug.apk --clobber

  tap-tests:
    # After the build, so the draft release exists for the pictures.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Tap tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: android
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || touch ../tests-failed
            adb pull /sdcard/Android/data/com.chessgamekiller.app/files/screens ../screens || true
            test ! -f ../tests-failed

      - name: Keep the pictures on the draft release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -d screens ] && gh release view android-testing >/dev/null 2>&1; then
            (cd screens && zip -q -r ../android-screens.zip .)
            gh release upload android-testing android-screens.zip --clobber
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screens
          path: |
            screens/
            android/app/build/reports/androidTests/
          retention-days: 30
