# Deployed by .github/workflows/scanner.yml. The Anthropic key is a Worker
# secret (ANTHROPIC_API_KEY), copied from the GitHub secret of the same name.
name = "chess-game-killer-scanner"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
# The Claude model that reads the board, and how hard it thinks (low to max).
# Opus 5.5 on low for every scan (Alex, 2026-11-11, to make Analyze quicker):
# it reads every test board right, photos too, in about 2.5 s. Sonnet 5.5 had
# to think on high for about 6 s to read an angled photo. About 1.2 cents a scan.
# (The app still sends X-Scan-Count; FAST_MODEL/FAST_SCANS would bring back a
# faster model for a player's first scans each month if MODEL changes again.)
MODEL = "claude-opus-5-5"
EFFORT = "low"
# The most scans a day across everyone. The address is public, so this caps the bill.
DAILY_LIMIT = "300"

# At most 10 scans a minute from one address, so a leaked URL can't run up the bill.
[[ratelimits]]
name = "SCAN_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Counts the day's scans for DAILY_LIMIT. SQLite storage works on the Workers Free plan.
[[durable_objects.bindings]]
name = "BUDGET"
class_name = "ScanBudget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ScanBudget"]
