# Coach Leo's "Talk it through" server. Deployed by .github/workflows/coach.yml
# to https://coach.chess-game-killer.workers.dev. The protocol is in PROTOCOL.md.
# The keys are Worker secrets, copied from the GitHub secrets of the same names:
# ANTHROPIC_API_KEY, and ELEVENLABS_API_KEY for Leo's voice (without it the app
# speaks Leo's answer with the device's voice).
name = "coach"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
# The Claude model that hears the player's claims and words Leo's answer, and
# how hard it thinks for each (low to max). It always thinks a little.
MODEL = "claude-sonnet-5-5"
PARSE_EFFORT = "low"
ANSWER_EFFORT = "low"
# How long each Claude call may take, in milliseconds. A slow answer falls back
# to the server's own wording.
CLAUDE_TIMEOUT_MS = "12000"
# The most talks a day across everyone, and the most characters of Leo's voice.
# The address is public, so these cap the bill.
DAILY_TALKS = "400"
DAILY_VOICE_CHARS = "40000"
# Leo's voice on ElevenLabs: Frederick (a calm, velvety, well-spoken Englishman, from the voice library), with the lessons' model, so he sounds the same.
VOICE_ID = "j9jfwdrw7BRfcR43Qohk"
VOICE_MODEL = "eleven_v4"
# Live Talk answers are read with ElevenLabs' Flash model, about half the cost per
# character of the lessons' model, in the same voice. Remove to match the lessons exactly.
TALK_VOICE_MODEL = "eleven_flash_v2_5"

# The deep review (POST /review): after a game the coach talks through the whole of it.
# One call to a stronger model than Talk's (to try Fable: "claude-fable-5-2", about twice
# the price), thinking a little more, with longer to answer.
REVIEW_MODEL = "claude-opus-5-5"
REVIEW_EFFORT = "medium"
REVIEW_TIMEOUT_MS = "45000"
# The most deep reviews a day across everyone. Each is about 13 cents (3 for Claude, about
# 10 for two minutes of voice), so this caps the day at about 20 dollars.
DAILY_REVIEWS = "150"

# At most 12 talks a minute from one address, so a leaked URL can't run up the bill.
[[ratelimits]]
name = "TALK_LIMITER"
namespace_id = "3001"
simple = { limit = 12, period = 60 }

# At most 4 deep reviews a minute from one address.
[[ratelimits]]
name = "REVIEW_LIMITER"
namespace_id = "3003"
simple = { limit = 4, period = 60 }

# Counts the day's talks, voice characters and deep reviews. SQLite storage works on the Workers Free plan.
[[durable_objects.bindings]]
name = "BUDGET"
class_name = "TalkBudget"

# Keeps Leo's spoken answers, so a line he has said before plays again for free.
[[durable_objects.bindings]]
name = "RECORDINGS"
class_name = "TalkRecordings"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TalkBudget"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["TalkRecordings"]
